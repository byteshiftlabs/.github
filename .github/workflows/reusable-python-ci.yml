name: Reusable Python CI

# Test matrix + ruff lint + wheel build, parameterized per caller repo.
# Modeled on premise's CI as of 2026-07-31.

on:
  workflow_call:
    inputs:
      python_versions:
        description: 'JSON array of Python versions to test against, e.g. ["3.11", "3.12"]'
        type: string
        default: '["3.11", "3.12"]'
      install_command:
        description: "Command to install the package and its test dependencies."
        type: string
        default: 'pip install -e ".[dev]"'
      test_command:
        description: "Command to run the test suite."
        type: string
        default: "python -m pytest tests/ -v"
      lock_file:
        description: "Path to a pinned dev/CI requirements lock file, or empty to skip that job."
        type: string
        default: ""
      run_lint:
        description: "Run ruff check ."
        type: boolean
        default: true
      build_wheel:
        description: "Build a wheel and smoke-test the install."
        type: boolean
        default: true
      wheel_smoke_test:
        description: "Command to run after installing the built wheel, to confirm it works."
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(inputs.python_versions) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && ${{ inputs.install_command }}

      - name: Test
        run: ${{ inputs.test_command }}

  test-locked:
    name: Test (pinned dependencies)
    if: inputs.lock_file != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "${{ inputs.lock_file }}"
          pip install --no-deps -e .

      - name: Test
        run: ${{ inputs.test_command }}

  lint:
    name: Lint (ruff)
    if: inputs.run_lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install --upgrade pip && ${{ inputs.install_command }}

      - name: Run ruff
        run: ruff check .

  build:
    name: Build wheel
    if: inputs.build_wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        run: python -m pip install --upgrade pip build && python -m build

      - name: Smoke test the built wheel
        if: inputs.wheel_smoke_test != ''
        run: |
          wheel=$(ls dist/*.whl)
          python -m pip install "${wheel}"
          ${{ inputs.wheel_smoke_test }}
