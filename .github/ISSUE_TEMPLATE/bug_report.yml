name: Bug report
description: Report a defect
labels: ["needs_triage"]
body:
  - type: dropdown
    id: how-found
    attributes:
      label: How was this found?
      description: >
        Be honest here — it changes how much a reviewer should trust the
        rest of the report.
      options:
        - Reproduced it (I ran the steps below and saw it happen)
        - Found by reading the code (not yet run/tested)
        - Hit in production/normal use
        - Reported by someone else, not independently verified
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What's wrong
      description: What looks wrong, and where in the code (file:line if known).
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: >
        Only fill this in if you actually ran these steps and confirmed the
        result. If you haven't, leave this blank and use the field below
        instead.
      placeholder: |
        1.
        2.
        3.

  - type: textarea
    id: confirm
    attributes:
      label: What would confirm or kill it
      description: >
        If this wasn't reproduced, what would settle whether it's real —
        a specific test to write, a build flag, a command to run.

  - type: textarea
    id: fix
    attributes:
      label: Possible fix
      description: Optional. A concrete suggestion, not required.
